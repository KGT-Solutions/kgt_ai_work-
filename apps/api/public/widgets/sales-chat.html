<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FLATBRIZ Sales Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] },
        colors: {
          primary: '#059669',
          'primary-light': '#34d39a',
          heading: '#06231a',
          secondary: '#2f5c4a',
          muted: '#7ba392',
          fieldbg: '#f2fbf6',
          fieldborder: '#cbe8db',
          track: '#e2f2ea',
          'success-text': '#0a7a55',
          'success-bg': '#cdf3e2',
          'neutral-text': '#4f7a67',
          'neutral-bg': '#dbeee5'
        },
        borderRadius: { xl2: '18px' }
      }
    }
  };
</script>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(180deg, #effdf5 0%, #d3f6e3 44%, #eafaf1 100%);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  }
  #messages { scrollbar-width: thin; scrollbar-color: #a8dcc2 transparent; }
  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-thumb { background: #a8dcc2; border-radius: 999px; }
  .dot { animation: bounce 1.2s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-4px); opacity: 1; } }
</style>
</head>
<body class="flex flex-col h-screen">

  <!-- Header -->
  <header class="shrink-0 bg-gradient-to-b from-primary-light to-primary px-4 pt-4 pb-3 shadow-sm">
    <div class="flex items-center justify-between">
      <div>
        <div class="text-[11px] font-bold tracking-wide uppercase text-white/80">FLATBRIZ</div>
        <div class="text-[17px] font-extrabold text-white leading-tight">Sales Assistant</div>
      </div>
      <button id="closeBtn" aria-label="Close chat"
        class="w-8 h-8 rounded-full bg-white/20 hover:bg-white/30 text-white flex items-center justify-center transition">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4">
          <path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" />
        </svg>
      </button>
    </div>

    <div class="mt-3">
      <label for="clientType" class="block text-[10.5px] font-semibold uppercase tracking-wide text-white/80 mb-1">
        I am a...
      </label>
      <select id="clientType"
        class="w-full rounded-xl2 border-0 bg-white/95 text-[13px] font-semibold text-heading px-3 py-2 focus:outline-none focus:ring-2 focus:ring-white/60">
        <option value="" disabled selected>Select your role</option>
        <option value="builder">Builder / Developer</option>
        <option value="rwa_president">RWA President</option>
        <option value="committee_member">Committee Member</option>
      </select>
    </div>
  </header>

  <!-- Messages -->
  <main id="messages" class="flex-1 overflow-y-auto px-3 py-4 space-y-3"></main>

  <!-- Composer -->
  <footer class="shrink-0 border-t border-fieldborder bg-white px-3 py-3">
    <form id="composerForm" class="flex items-end gap-2">
      <textarea id="queryInput" rows="1" placeholder="Ask about FLATBRIZ..."
        class="flex-1 resize-none rounded-xl2 bg-fieldbg border border-fieldborder text-[13px] text-heading placeholder-muted px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-primary/40 disabled:opacity-50"
        disabled></textarea>
      <button id="sendBtn" type="submit" disabled
        class="shrink-0 w-10 h-10 rounded-full bg-gradient-to-b from-primary-light to-primary text-white flex items-center justify-center disabled:opacity-40 disabled:cursor-not-allowed transition active:scale-95">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4">
          <path d="M3.105 2.289a.75.75 0 00-.826.95l1.414 4.925A1.5 1.5 0 005.135 9.25h6.115a.75.75 0 010 1.5H5.135a1.5 1.5 0 00-1.442 1.086l-1.414 4.926a.75.75 0 00.826.95 28.896 28.896 0 0015.293-7.154.75.75 0 000-1.115A28.896 28.896 0 003.105 2.289z" />
        </svg>
      </button>
    </form>
  </footer>

<script>
(function () {
  var messagesEl = document.getElementById('messages');
  var form = document.getElementById('composerForm');
  var input = document.getElementById('queryInput');
  var sendBtn = document.getElementById('sendBtn');
  var clientTypeSelect = document.getElementById('clientType');
  var closeBtn = document.getElementById('closeBtn');

  var CLIENT_LABELS = {
    builder: 'Builder / Developer',
    rwa_president: 'RWA President',
    committee_member: 'Committee Member'
  };

  function el(tag, className, html) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (html != null) node.innerHTML = html;
    return node;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addUserBubble(text) {
    var wrap = el('div', 'flex justify-end');
    var bubble = el(
      'div',
      'max-w-[80%] bg-gradient-to-b from-primary-light to-primary text-white text-[13px] leading-snug font-medium rounded-xl2 rounded-br-sm px-3.5 py-2.5 shadow-sm',
      escapeHtml(text)
    );
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    scrollToBottom();
  }

  function addBotTyping() {
    var wrap = el('div', 'flex justify-start');
    wrap.id = 'typingBubble';
    var bubble = el(
      'div',
      'bg-white border border-fieldborder rounded-xl2 rounded-bl-sm px-4 py-3 shadow-sm flex items-center gap-1'
    );
    ['dot', 'dot', 'dot'].forEach(function () {
      bubble.appendChild(el('span', 'dot w-1.5 h-1.5 rounded-full bg-muted inline-block'));
    });
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function addBotBubble(payload) {
    var wrap = el('div', 'flex justify-start');
    var card = el('div', 'max-w-[85%] bg-white border border-fieldborder rounded-xl2 rounded-bl-sm px-3.5 py-3 shadow-sm space-y-2');

    var text = el('div', 'text-[13px] leading-snug font-medium text-heading whitespace-pre-wrap', escapeHtml(payload.answer));
    card.appendChild(text);

    if (payload.keyBenefitsHighlighted && payload.keyBenefitsHighlighted.length) {
      var badgeWrap = el('div', 'flex flex-wrap gap-1.5 pt-1');
      payload.keyBenefitsHighlighted.forEach(function (benefit) {
        badgeWrap.appendChild(
          el('span', 'inline-block text-[10.5px] font-semibold text-success-text bg-success-bg rounded-full px-2.5 py-1', escapeHtml(benefit))
        );
      });
      card.appendChild(badgeWrap);
    }

    if (payload.suggestedFollowUp) {
      var cta = el(
        'button',
        'mt-1 w-full text-left text-[12px] font-semibold text-primary bg-fieldbg border border-fieldborder hover:bg-track rounded-xl2 px-3 py-2 transition',
        '→ ' + escapeHtml(payload.suggestedFollowUp)
      );
      cta.addEventListener('click', function () {
        sendMessage(payload.suggestedFollowUp);
      });
      card.appendChild(cta);
    }

    wrap.appendChild(card);
    messagesEl.appendChild(wrap);
    scrollToBottom();
  }

  function addSystemNote(text) {
    var wrap = el('div', 'flex justify-center');
    wrap.appendChild(el('div', 'text-[11px] text-muted font-medium text-center px-4', escapeHtml(text)));
    messagesEl.appendChild(wrap);
    scrollToBottom();
  }

  function setComposerEnabled(enabled) {
    input.disabled = !enabled;
    sendBtn.disabled = !enabled;
  }

  function friendlyErrorMessage(status, body) {
    if (status === 0) {
      return "Sorry, I couldn't reach FLATBRIZ right now. Please check your connection and try again, or email sales@kgt.solutions.";
    }
    if (status === 429) {
      return "You're sending messages a little fast — please wait a moment and try again.";
    }
    if (status === 400 && body && body.error) {
      return body.error;
    }
    return 'Something went wrong on our end. Please try again in a moment, or email sales@kgt.solutions.';
  }

  function sendMessage(text) {
    var query = String(text || '').trim();
    if (!query) return;
    if (!clientTypeSelect.value) {
      addSystemNote('Please select your role above first.');
      return;
    }

    addUserBubble(query);
    input.value = '';
    setComposerEnabled(false);
    var typingBubble = addBotTyping();

    fetch('/api/v1/chat/sales', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ query: query, clientType: clientTypeSelect.value })
    })
      .then(function (res) {
        return res
          .json()
          .catch(function () { return {}; })
          .then(function (body) { return { status: res.status, ok: res.ok, body: body }; });
      })
      .then(function (result) {
        typingBubble.remove();
        if (!result.ok) {
          addBotBubble({ answer: friendlyErrorMessage(result.status, result.body), keyBenefitsHighlighted: [], suggestedFollowUp: null });
          return;
        }
        addBotBubble(result.body);
      })
      .catch(function () {
        typingBubble.remove();
        addBotBubble({ answer: friendlyErrorMessage(0), keyBenefitsHighlighted: [], suggestedFollowUp: null });
      })
      .finally(function () {
        setComposerEnabled(true);
        input.focus();
      });
  }

  clientTypeSelect.addEventListener('change', function () {
    if (!clientTypeSelect.value) return;
    setComposerEnabled(true);
    input.focus();
    addSystemNote("You're chatting as a " + CLIENT_LABELS[clientTypeSelect.value]);
    if (!messagesEl.dataset.greeted) {
      messagesEl.dataset.greeted = '1';
      addBotBubble({
        answer:
          "Hi! I'm the FLATBRIZ Sales Assistant. Ask me anything — pricing vs. MyGate/NoBroker, how UPI collections work, migrating from spreadsheets, whatever's on your mind.",
        keyBenefitsHighlighted: [],
        suggestedFollowUp: null
      });
    }
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    sendMessage(input.value);
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  closeBtn.addEventListener('click', function () {
    window.parent.postMessage({ type: 'flatbriz-sales-chat:close' }, '*');
  });
})();
</script>
</body>
</html>
