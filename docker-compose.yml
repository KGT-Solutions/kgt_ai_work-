# KGT AI Hub — multi-tenant Support + Sales chatbot platform.
# Own database, container names and ports, so it runs alongside Flatbriz
# (society-*) on the same host without sharing anything.
#
# Deploy with:  docker compose --env-file .env.docker up -d --build
# (build args below need compose to see the env file.) The API container
# reads its own settings from HUB_ENV_FILE, default .env.docker.

services:
  postgres:
    image: postgres:16-alpine
    container_name: kgt-ai-hub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kgthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kgthub}
      POSTGRES_DB: ${POSTGRES_DB:-kgthub}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - kgt_ai_hub_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    container_name: kgt-ai-hub-api
    env_file: ${HUB_ENV_FILE:-.env.docker}
    # PID 1 must reap zombie processes: `exec node` makes Node PID 1, which
    # doesn't — every Chromium helper process the crawler's browser tier
    # spawns would otherwise linger as a zombie after it exits.
    init: true
    ports:
      - "${API_PORT:-4100}:4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kgthub}:${POSTGRES_PASSWORD:-kgthub}@postgres:5432/${POSTGRES_DB:-kgthub}?schema=public
      PGHOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-kgthub}
      POSTGRES_DB: ${POSTGRES_DB:-kgthub}
      PORT: 4000
      # Secrets (JWT_SECRET, HUB_ADMIN_*, LLM keys) come ONLY from env_file.
      # Listing them here as ${VAR:-} would override env_file with whatever
      # the shell had at `compose up` time — an empty value whenever compose
      # runs without --env-file.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4100}
    container_name: kgt-ai-hub-web
    ports:
      - "${WEB_PORT:-3100}:3001"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kgt_ai_hub_pg_data:
