# KGT AI Hub — multi-tenant Support + Sales chatbot platform.
# Own database, container names and ports, so it runs alongside Flatbriz
# (society-*) on the same host without sharing anything.
#
# Deploy with:  docker compose --env-file .env.docker up -d --build
# (build args below need compose to see the env file.) The API container
# reads its own settings from HUB_ENV_FILE, default .env.docker.

services:
  postgres:
    image: postgres:16-alpine
    container_name: kgt-ai-hub-postgres
    # Same file as the API so credentials stay in sync even when compose is
    # started without `--env-file` (interpolation would otherwise force the
    # default kgthub/kgthub password and break an existing volume).
    env_file: ${HUB_ENV_FILE:-.env.docker}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - kgt_ai_hub_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    container_name: kgt-ai-hub-api
    env_file: ${HUB_ENV_FILE:-.env.docker}
    # PID 1 must reap zombie processes: `exec node` makes Node PID 1, which
    # doesn't — every Chromium helper process the crawler's browser tier
    # spawns would otherwise linger as a zombie after it exits.
    init: true
    ports:
      - "${API_PORT:-4100}:4000"
    environment:
      PGHOST: postgres
      PORT: 4000
      # DATABASE_URL is built in docker-entrypoint.sh from POSTGRES_* in
      # env_file. Do not interpolate it here: ${POSTGRES_PASSWORD:-kgthub}
      # overrides .env.docker whenever compose is run without --env-file.
      # Secrets (JWT_SECRET, HUB_ADMIN_*, LLM keys) come ONLY from env_file
      # for the same reason.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4100}
    container_name: kgt-ai-hub-web
    ports:
      - "${WEB_PORT:-3100}:3001"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kgt_ai_hub_pg_data:
